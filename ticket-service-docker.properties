spring.datasource.url=jdbc:postgresql://ticket-db:5432/ticket_db
spring.datasource.username=postgres
spring.datasource.password=12345678

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.scheduleServiceClient.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.scheduleServiceClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.scheduleServiceClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.scheduleServiceClient.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.scheduleServiceClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.scheduleServiceClient.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.userServiceClient.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.userServiceClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userServiceClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userServiceClient.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.userServiceClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userServiceClient.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.scheduleServiceClient.max-attempts=3
resilience4j.retry.instances.scheduleServiceClient.wait-duration=2s

resilience4j.retry.instances.userServiceClient.max-attempts=3
resilience4j.retry.instances.userServiceClient.wait-duration=2s

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=http://localhost:8080,http://localhost:3000,http://localhost:4200
springdoc.swagger-ui.servers=http://localhost:8080/ticket,http://localhost:9191

# Actuator Health Indicators
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
# Eureka
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
