spring.datasource.url=jdbc:postgresql://movie-db:5432/movie_db
spring.datasource.username=postgres
spring.datasource.password=12345678

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate

# Distributed Tracing with Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dv9473ke9}
cloudinary.api-key=${CLOUDINARY_API_KEY:831237963945825}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:Qoz0deZDlsoGrQ6JrAjYZrWeyho

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Resilience4j Circuit Breaker Configuration (for any future internal service calls)
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

# Actuator Health Indicators
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
# Eureka
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
